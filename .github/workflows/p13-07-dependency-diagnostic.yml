name: P13-07 patched graph generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Skip generated output head
        id: sentinel
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[patched-graph-output]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.sentinel.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        if: steps.sentinel.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Generate and audit patched graph
        if: steps.sentinel.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          pnpm install --lockfile-only
          pnpm audit --json > /tmp/audit.json || true
          node <<'NODE' > .tmp/p13-07-final-audit.txt
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const ghsa = /GHSA-[0-9A-Za-z-]+/g;
          const seen = new Set();
          function visit(value, path = []) {
            if (Array.isArray(value)) return value.forEach((item, i) => visit(item, [...path, String(i)]));
            if (!value || typeof value !== 'object') return;
            const severity = typeof value.severity === 'string' ? value.severity : '';
            if (['low', 'moderate', 'high', 'critical'].includes(severity)) {
              const ids = [...JSON.stringify(value).matchAll(ghsa)].map((m) => m[0]);
              const name = value.name ?? value.module_name ?? value.package ?? path.at(-1) ?? 'unknown';
              for (const id of ids) {
                const key = `${id}|${name}|${severity}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  console.log(`${id}\t${name}\t${severity}`);
                }
              }
            }
            for (const [key, child] of Object.entries(value)) visit(child, [...path, key]);
          }
          visit(report);
          console.log(`COUNTS=${JSON.stringify(report.metadata?.vulnerabilities ?? {})}`);
          NODE

      - name: Persist patched graph
        if: steps.sentinel.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .tmp/p13-07-final-audit.txt
          git commit -m 'fix(security): generate patched dependency graph [patched-graph-output]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
