name: P13-07 audit remediation diagnostic

on:
  push:
    branches:
      - agent/p13-07-dependency-vulnerability-remediation

permissions:
  contents: write

jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen graph
        run: pnpm install --frozen-lockfile

      - name: Test pnpm audit remediation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .tmp
          pnpm audit --json > /tmp/audit-before.json || true
          node <<'NODE' > .tmp/p13-07-audit-remediation.txt
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          console.log(`BASE_HEAD=${process.env.GITHUB_SHA}`);
          console.log('===== AUDIT BEFORE =====');
          const vulnerabilities = report.vulnerabilities ?? {};
          for (const [pkg, value] of Object.entries(vulnerabilities).sort()) {
            console.log(`PACKAGE ${pkg} severity=${value.severity} range=${value.range ?? ''} fix=${JSON.stringify(value.fixAvailable ?? null)}`);
            for (const via of value.via ?? []) {
              if (typeof via === 'string') {
                console.log(`  VIA ${via}`);
                continue;
              }
              console.log(`  VIA severity=${via.severity ?? ''} range=${via.range ?? ''} title=${via.title ?? ''} url=${via.url ?? ''}`);
            }
          }
          console.log(`COUNTS ${JSON.stringify(report.metadata?.vulnerabilities ?? {})}`);
          NODE

          cp package.json /tmp/package-before.json
          cp pnpm-lock.yaml /tmp/lock-before.yaml
          set +e
          pnpm audit --fix >> .tmp/p13-07-audit-remediation.txt 2>&1
          fix_exit=$?
          set -e
          echo "AUDIT_FIX_EXIT=${fix_exit}" >> .tmp/p13-07-audit-remediation.txt
          echo '===== AUDIT FIX DIFF =====' >> .tmp/p13-07-audit-remediation.txt
          git diff -- package.json pnpm-lock.yaml >> .tmp/p13-07-audit-remediation.txt || true

          pnpm audit --json > /tmp/audit-after.json || true
          node <<'NODE' >> .tmp/p13-07-audit-remediation.txt
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
          console.log('===== AUDIT AFTER =====');
          const vulnerabilities = report.vulnerabilities ?? {};
          for (const [pkg, value] of Object.entries(vulnerabilities).sort()) {
            console.log(`PACKAGE ${pkg} severity=${value.severity} range=${value.range ?? ''} fix=${JSON.stringify(value.fixAvailable ?? null)}`);
            for (const via of value.via ?? []) {
              if (typeof via === 'string') {
                console.log(`  VIA ${via}`);
                continue;
              }
              console.log(`  VIA severity=${via.severity ?? ''} range=${via.range ?? ''} title=${via.title ?? ''} url=${via.url ?? ''}`);
            }
          }
          console.log(`COUNTS ${JSON.stringify(report.metadata?.vulnerabilities ?? {})}`);
          NODE

      - name: Persist diagnostic output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .tmp/p13-07-audit-remediation.txt
          if git diff --cached --quiet; then
            echo 'No remediation output changes to persist.'
            exit 0
          fi
          git commit -m 'chore(security): capture audit remediation [audit-fix-output]'
          git push origin HEAD:${GITHUB_REF_NAME}
