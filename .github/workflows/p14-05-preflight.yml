name: P14-05 preflight

on:
  push:
    branches:
      - agent/p14-05-durable-execution

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/p14-05-durable-execution
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize durable observer and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/backend/agent-durable/src/lib/durable-execution.ts')
          source = path.read_text()
          start = source.index('async function emit(')
          end = source.index('\nexport interface DurableCheckpointInput', start)
          replacement = '''async function emit(
            observer: DurableExecutionObserver | undefined,
            record: DurableRunRecord,
            event: Omit<
              DurableExecutionEvent,
              keyof DurableRunIdentity | 'status' | 'attemptCount' | 'fence'
            >,
          ): Promise<void> {
            if (!observer) return;
            const payload: DurableExecutionEvent = {
              type: event.type,
              runId: record.runId,
              traceId: record.traceId,
              actorId: record.actorId,
              conversationId: record.conversationId,
              status: record.status,
              attemptCount: record.attemptCount,
              fence: record.fence,
              ...(event.checkpointSequence === undefined
                ? {}
                : { checkpointSequence: event.checkpointSequence }),
              ...(event.approvalId === undefined
                ? {}
                : { approvalId: event.approvalId }),
              ...(event.approvalDecision === undefined
                ? {}
                : { approvalDecision: event.approvalDecision }),
              ...(event.failureCode === undefined
                ? {}
                : { failureCode: event.failureCode }),
            };

            const correlation = createCorrelationContext({
              requestId: record.runId,
              traceId: record.traceId,
              actorId: record.actorId,
              eventId: record.runId,
              jobId: record.runId,
              correlationId: record.conversationId,
            });
            await runWithCorrelationContext(correlation, () => observer(payload));
          }
          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
          pnpm exec prettier --write \
            packages/backend/agent-durable \
            docs/adr/0024-optional-durable-agent-execution.md \
            docs/durable-agent-execution.md \
            docs/TODO.md \
            docs/architecture/overview.md \
            docs/architecture/project-graph.md \
            wiki/Architecture.md \
            wiki/Home.md \
            wiki/Optional-AI-Runtime.md \
            tsconfig.json
      - run: pnpm nx run backend-agent-durable:typecheck
      - run: pnpm nx run backend-agent-durable:test
      - run: pnpm nx run backend-agent-durable:lint
      - run: pnpm nx run backend-agent-durable:build
      - run: pnpm docs:check
      - run: pnpm agent-eval:check
      - run: pnpm format:check
      - name: Commit preflight corrections and remove probe
        run: |
          rm .github/workflows/p14-05-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: apply P14-05 preflight corrections'
          git push origin HEAD:agent/p14-05-durable-execution
