name: Delivery

on:
  pull_request:
    paths:
      - '.github/workflows/delivery.yml'
      - 'packages/**'
      - 'tools/p14-06-review-materialize.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fix
        run: python tools/p14-06-review-materialize.py
      - name: Format review fix
        run: pnpm exec prettier --write packages/backend/agent-governance/src/lib/governance.ts packages/backend/agent-governance/src/lib/review-regressions.spec.ts
      - name: Validate governance project
        run: |
          pnpm nx run backend-agent-governance:typecheck
          pnpm nx run backend-agent-governance:test
          pnpm nx run backend-agent-governance:lint
          pnpm nx run backend-agent-governance:build
          pnpm format:check
      - name: Push materialized tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C agent/p14-06-review-materialized
          git add packages/backend/agent-governance/src/lib/governance.ts packages/backend/agent-governance/src/lib/review-regressions.spec.ts
          git commit -m 'fix(agent): harden governance runtime validation'
          git push --force origin HEAD:refs/heads/agent/p14-06-review-materialized
